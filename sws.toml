# Static Web Server (SWS) configuration: security and cache headers.
# Also used by the Clever Cloud "Static" runtime.
# Rules apply in order: a later rule overrides the same header set by an earlier one.

[general]
# Serve dot-folders too (needed for /.well-known/security.txt).
# SWS >= 2.41 defaults to true, which makes dotfiles answer 404.
ignore-hidden-files = false

[advanced]

# 1. Every response (pages, CSS, font, favicon, 404 page)
[[advanced.headers]]
source = "**"
[advanced.headers.headers]
Content-Security-Policy = "default-src 'none'; style-src 'self'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
Strict-Transport-Security = "max-age=63072000; includeSubDomains"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "no-referrer"
Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
Cross-Origin-Opener-Policy = "same-origin"
Cross-Origin-Resource-Policy = "same-origin"
X-Frame-Options = "DENY"
# Overrides SWS default cache (1 year for .css): revalidate on every visit,
# so that every fix shows up at once.
Cache-Control = "public, max-age=0, must-revalidate"

# 2. Font: cached for a year, immutable (rename the file, -v2, if it changes)
[[advanced.headers]]
source = "/fonts/**"
[advanced.headers.headers]
Cache-Control = "public, max-age=31536000, immutable"

# 3. security.txt: media type required by RFC 9116
[[advanced.headers]]
source = "/.well-known/security.txt"
[advanced.headers.headers]
Content-Type = "text/plain; charset=utf-8"
